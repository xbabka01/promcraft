[project]
site_name = "promcraft"
site_description = "Build Prometheus PromQL queries programmatically with composable, typed Python objects."
site_url = "https://xbabka01.github.io/promcraft/"
repo_url = "https://github.com/xbabka01/promcraft"
repo_name = "xbabka01/promcraft"
edit_uri = "edit/main/docs/"
nav = [
  { "Home" = "index.md" },
  { "Guide" = [
    { "Literals and variables" = "guide/literals.md" },
    { "Selectors and subqueries" = "guide/selectors.md" },
    { "Binary operators" = "guide/operators.md" },
    { "Aggregations" = "guide/aggregations.md" },
    { "Functions" = "guide/functions.md" },
    { "Composing and formatting" = "guide/formatting.md" },
  ] },
  { "API reference" = [
    { "Query and Style" = "api/base.md" },
    { "Literals and variables" = "api/literals.md" },
    { "Selectors and subqueries" = "api/selectors.md" },
    { "Binary operators" = "api/operators.md" },
    { "Aggregations" = "api/aggregations.md" },
    { "Functions" = "api/functions.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.superfences = {}

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
# get_indent is a rendering helper inherited by every Query subclass
filters = ["!^_", "!^get_indent$"]
inherited_members = true
merge_init_into_class = true
members_order = "source"
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
show_source = false
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
heading_level = 2
