name: Pytest
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.15', '3.14', '3.13', '3.12', '3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: xbabka01/poetry-action@727695e974cfe009c799c73fc9d1c59ef5a8e1af # v2
        with:
          python_version: ${{ matrix.python_version }}
      - name: Poetry check
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install
      - name: Test with pytest
        run: poetry run pytest --junitxml=reports/junit.xml --cov-report=xml:reports/coverage.xml
      - name: Write job summary
        if: ${{ !cancelled() && hashFiles('reports/junit.xml') != '' }}
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("reports/junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          total = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "failures", "errors", "skipped")}
          passed = total["tests"] - total["failures"] - total["errors"] - total["skipped"]
          print("### Tests (Python ${{ matrix.python_version }})\n")
          print("| Passed | Failed | Errors | Skipped | Total |")
          print("|---|---|---|---|---|")
          print(f"| {passed} | {total['failures']} | {total['errors']} | {total['skipped']} | {total['tests']} |\n")
          EOF
          if [ -f .coverage ]; then
            echo "### Coverage"
            echo
            poetry run coverage report --format=markdown
          fi >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.python_version }}
          path: reports/
          if-no-files-found: ignore
