name: Pytest
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version: ['3.15', '3.14', '3.13', '3.12', '3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: xbabka01/poetry-action@33b75886ee1504a47eb3ee3050045a2bb6d01db6 # v1
        with:
          python_version: ${{ matrix.python_version }}
      - name: Poetry check
        run: |
          poetry check --lock
      - name: Install dependencies
        run: |
          poetry install
      - name: Test with pytest
        id: pytest
        shell: bash
        run: |
          poetry run pytest
