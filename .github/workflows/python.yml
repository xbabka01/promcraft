name: Pytest
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.15', '3.14', '3.13', '3.12', '3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: xbabka01/poetry-action@727695e974cfe009c799c73fc9d1c59ef5a8e1af # v2
        with:
          python_version: ${{ matrix.python_version }}
      - name: Poetry check
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install
      # mypy python_version and ruff target-version are fixed in pyproject.toml,
      # so one matrix entry is enough for the static checks
      - name: Check formatting with ruff
        if: ${{ matrix.python_version == '3.11' }}
        run: poetry run ruff format --check --diff
      - name: Lint with ruff
        if: ${{ !cancelled() && matrix.python_version == '3.11' }}
        run: poetry run ruff check
      - name: Check with mypy
        if: ${{ !cancelled() && matrix.python_version == '3.11' }}
        run: poetry run mypy
      - name: Test with pytest
        if: ${{ !cancelled() }}
        run: poetry run pytest
